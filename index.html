.ga-root{
  --paper:#F8F7F3;
  --ink:#121212;
  --muted:#6E6E6C;
  --line:#D2D2CE;
  --white:#FFFFFF;
  --sans:'GmarketSans','Pretendard Variable',Pretendard,system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-weight:500;
  -webkit-font-smoothing:antialiased;
  line-height:1.55;
  word-break:keep-all;
  overflow-wrap:break-word;
  overflow-x:hidden;
}
.ga-root *{box-sizing:border-box;margin:0;padding:0;font-family:inherit}
.muted{color:var(--muted)}
.ink{color:var(--ink)}

.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.reveal.is-vis{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}

.link-btn{
  background:none;border:none;cursor:pointer;
  display:inline-flex;align-items:center;gap:10px;
  font-size:15px;font-weight:500;color:var(--ink);padding:2px 0;
}
.link-btn .arw{transition:transform .3s ease}
.link-btn:hover .arw{transform:translateX(6px)}
.arw{display:inline-block}

/* NAV */
.nav{position:sticky;top:0;z-index:50;background:var(--paper)}
.nav-inner{max-width:1360px;margin:0 auto;padding:20px 40px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-weight:700;letter-spacing:-.01em;font-size:20px;cursor:pointer;white-space:nowrap}
.nav-links{display:flex;gap:36px}
.nav-links a{cursor:pointer;font-size:14px;font-weight:500;letter-spacing:.02em;color:var(--ink);transition:opacity .2s}
.nav-links a:hover{opacity:.55}
.nav-cta{
  cursor:pointer;background:none;
  border:1px solid var(--line);border-radius:100px;padding:11px 20px;
  font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;color:var(--ink);
  transition:background .25s,color .25s
}
.nav-cta:hover{background:var(--ink);color:#fff}
.burger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:6px}
.burger span{width:24px;height:2px;background:var(--ink);display:block}
.nav-mobile{display:flex;flex-direction:column;padding:8px 24px 22px;gap:16px;border-top:1px solid var(--line)}
.nav-mobile a{cursor:pointer;font-size:16px;font-weight:700}

/* HERO */
.hero{max-width:1360px;margin:0 auto;padding:40px 40px 90px}
.hero-word{
  font-weight:700;letter-spacing:-.03em;line-height:.9;
  font-size:clamp(2rem,11.5vw,10rem);
}
.hero-body{display:flex;justify-content:space-between;gap:48px;margin-top:0;flex-wrap:wrap}
.hero-left{flex:1 1 380px;display:flex;flex-direction:column;gap:26px;justify-content:flex-end}
.hero-tag{font-weight:700;letter-spacing:-.01em;line-height:1.35;font-size:clamp(1.4rem,2.5vw,2.2rem);max-width:20em}
.hero-right{flex:0 1 480px;display:flex;flex-direction:column;gap:14px}
.hero-media{width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden}

/* SECTION */
.section{max-width:1360px;margin:0 auto;padding:clamp(70px,10vw,150px) 40px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:56px}
.sec-title{font-weight:700;letter-spacing:-.03em;line-height:1.0;font-size:clamp(2.6rem,8vw,7rem)}
.sec-title .t-gray,.sec-title .t-ink{display:block}
.t-gray{color:var(--muted)}
.t-ink{color:var(--ink)}
.sec-tag{font-size:clamp(1rem,1.4vw,1.3rem);font-weight:500;white-space:nowrap;padding-bottom:.5em}

/* ABOUT */
.about-grid{display:flex;gap:40px;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}
.about-title{flex:1 1 320px}
.about-title .sec-title{font-size:clamp(2.8rem,7.5vw,6.6rem)}
.about-title .sec-tag{display:inline-block;margin-top:10px}
.about-right{flex:1 1 440px;max-width:620px;display:flex;flex-direction:column;gap:26px;padding-top:10px}
.about-copy{font-weight:500;letter-spacing:-.01em;line-height:1.5;font-size:clamp(1.3rem,2.2vw,1.9rem);color:var(--muted)}
.about-copy .ink{font-weight:700;color:var(--ink)}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:80px;border-top:1px solid var(--line)}
.stat{padding:26px 24px 0 0;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat-n{font-weight:700;letter-spacing:-.02em;font-size:clamp(1.9rem,4vw,3.2rem)}
.stat-l{font-size:14px;color:var(--muted);margin-top:6px;font-weight:500}

/* CAREER TIMELINE */
.tl{border-top:1px solid var(--line)}
.tl-row{display:grid;grid-template-columns:200px 1fr;gap:0;border-bottom:1px solid var(--line);padding:26px 0;align-items:start}
.tl-when{font-size:14px;color:var(--muted);font-weight:500;position:relative;padding-left:22px}
.tl-when:before{content:"";position:absolute;left:0;top:6px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:2px solid var(--line)}
.tl-row.key .tl-when:before{background:var(--ink);border-color:var(--ink)}
.tl-org{font-weight:700;font-size:clamp(1.3rem,2vw,1.7rem);letter-spacing:-.02em}
.tl-role{font-size:13px;font-weight:500;color:var(--muted);margin-left:12px}
.tl-desc{font-size:15px;color:var(--muted);margin-top:8px;line-height:1.65;max-width:none;font-weight:500;white-space:pre-line}

/* PROJECTS */
.pj-featured{margin-bottom:20px}
.pj-card{display:block;cursor:pointer;text-decoration:none;color:inherit}
.pj-img{width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden}
.pj-img svg{transition:transform .6s cubic-bezier(.16,1,.3,1)}
.pj-card:hover .pj-img svg{transform:scale(1.05)}
.pj-info{padding:18px 4px 0}
.pj-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.pj-title{font-weight:700;letter-spacing:-.02em;font-size:clamp(1.5rem,2.6vw,2.2rem)}
.pj-title.sm{font-size:clamp(1.3rem,2.1vw,1.7rem)}
.pj-cat{color:var(--muted);font-size:14px;margin-top:6px;font-weight:500}
.pj-desc{color:var(--muted);font-size:14.5px;line-height:1.7;margin-top:12px;max-width:70ch;font-weight:500;white-space:pre-line}
.pj-link{display:inline-block;margin-top:14px;color:#2f6bff;font-weight:600;font-size:15px;text-decoration:none}
.pj-link:hover{text-decoration:underline}
.pj-featured .pj-img{aspect-ratio:21/9}
.pj-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px 28px;margin-top:44px}
.pj-cell .pj-img{aspect-ratio:4/3}

/* CAPABILITIES */
.cap-list{border-top:1px solid var(--line)}
.cap-row{display:grid;grid-template-columns:80px 1fr 130px;gap:24px;align-items:center;border-bottom:1px solid var(--line);padding:32px 0}
.cap-no{font-size:14px;color:var(--muted);font-weight:500}
.cap-t{font-weight:700;letter-spacing:-.02em;font-size:clamp(1.5rem,2.6vw,2.2rem)}
.cap-d{color:var(--muted);font-size:15px;line-height:1.65;margin-top:8px;max-width:54ch;font-weight:500;white-space:pre-line}
.cap-img{width:110px;height:110px;border-radius:14px;overflow:hidden;justify-self:end;transition:transform .35s ease}
.cap-row:hover .cap-img{transform:scale(1.05)}

/* CREDENTIALS */
.cred-scroll{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.cred-card{background:#fff;border-radius:16px;padding:26px 24px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.cred-org{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.cred-t{font-weight:700;font-size:1.15rem;letter-spacing:-.01em;line-height:1.3}
.cred-d{color:var(--muted);font-size:14px;line-height:1.6;flex:1;font-weight:500}
.cred-date{font-size:13px;color:var(--muted);font-weight:500}
.award-strip{margin-top:34px;border-top:1px solid var(--line);padding-top:22px;display:flex;gap:24px;flex-wrap:wrap;align-items:baseline}
.award-label{font-size:14px;font-weight:700}
.award-items{display:flex;gap:10px;flex-wrap:wrap}
.award-chip{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:100px;padding:7px 14px;font-weight:500}

/* FAQ */
.faq-grid{display:grid;grid-template-columns:340px 1fr;gap:40px;align-items:start}
.faq-ask{font-weight:700;letter-spacing:-.02em;font-size:clamp(1.5rem,2.6vw,2.2rem);line-height:1.25;margin-bottom:24px}
.faq-list{display:flex;flex-direction:column;gap:14px}
.faq-item{width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:16px;padding:22px 24px;color:inherit;transition:background .25s}
.faq-item:hover{background:#fff}
.faq-q{display:flex;justify-content:space-between;align-items:center;gap:16px;font-weight:700;font-size:1.05rem;cursor:pointer}
.faq-ic{font-size:1.4rem;color:var(--muted);line-height:1}
.faq-a{overflow:hidden;transition:max-height .4s ease}
.faq-a p{padding-top:14px;color:var(--muted);font-size:14.5px;line-height:1.7;font-weight:500;white-space:pre-line}

/* CTA */
.cta{max-width:1360px;margin:0 auto;padding:clamp(70px,9vw,140px) 40px}
.cta-text{font-weight:700;letter-spacing:-.025em;line-height:1.5;font-size:clamp(1.6rem,4.2vw,3.6rem)}
.cta-text .t-gray,.cta-text .t-ink{display:inline}

/* TICKER */
.ticker{background:#EAF06B;overflow:hidden;padding:14px 0}
.ticker-track{display:flex;width:max-content;animation:marq 16s linear infinite}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none}}
.ticker-set{display:flex;flex-shrink:0}
.ticker-item{display:inline-flex;align-items:center;gap:22px;padding:0 22px;font-weight:700;font-size:15px;white-space:nowrap}
.ticker-item .dot{font-size:8px;color:#121212;opacity:.5}

/* FOOTER */
.footer{background:var(--ink);color:#fff;padding:60px 40px 40px}
.foot-body{max-width:1360px;margin:0 auto;display:flex;justify-content:space-between;gap:48px;flex-wrap:wrap}
.foot-contact{flex:1 1 320px;max-width:460px}
.foot-contact h4{font-size:14px;opacity:.6;font-weight:500;margin-bottom:16px}
.foot-mail{display:block;color:#fff;text-decoration:none;font-weight:700;font-size:clamp(1.3rem,2.4vw,1.9rem);letter-spacing:-.02em;margin-bottom:6px;transition:opacity .2s;word-break:break-all}
.foot-mail:hover{opacity:.6}
.foot-menu{display:flex;gap:56px;flex-wrap:wrap}
.foot-col{display:flex;flex-direction:column;gap:12px}
.foot-col a{color:#fff;text-decoration:none;font-size:14px;font-weight:500;letter-spacing:.03em;cursor:pointer;opacity:.85;transition:opacity .2s}
.foot-col a:hover{opacity:.5}
.foot-cap{font-size:12px;opacity:.45;letter-spacing:.04em;margin-top:4px}
.foot-line{font-size:14px;opacity:.8;font-weight:500}
.foot-logo{max-width:1360px;margin:56px auto 0;font-weight:700;letter-spacing:-.02em;font-size:clamp(2.4rem,12vw,9.5rem);line-height:1;opacity:.92}

/* ---------- RESPONSIVE ---------- */
@media (max-width:1000px){
  .nav-links{display:none}
  .nav-cta{display:none}
  .burger{display:flex}
  .nav-inner{padding:18px 24px}
  .section{padding:70px 24px}
  .hero{padding:24px 24px 60px}
  .cta{padding:70px 24px}
  .footer{padding:48px 24px 32px}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:none}
  .stat{border-bottom:1px solid var(--line);padding-bottom:22px}
  .tl-row{grid-template-columns:1fr;gap:10px}
  .pj-grid{grid-template-columns:1fr}
  .cap-row{grid-template-columns:44px 1fr;gap:16px}
  .cap-img{display:none}
  .cred-scroll{grid-template-columns:1fr}
  .faq-grid{grid-template-columns:1fr;gap:28px}
}
@media (max-width:520px){
  .sec-head{flex-direction:column;align-items:flex-start;gap:8px}
  .sec-tag{padding-bottom:0}
  .about-copy{font-size:1.25rem}
  .foot-menu{gap:36px}
}
